version: "3.9"

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: freebuff-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: freebuff
      POSTGRES_USER: freebuff
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freebuff -d freebuff"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: freebuff-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
