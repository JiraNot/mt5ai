services:
  mt5-node:
    build:
      context: .
      dockerfile: docker/mt5/Dockerfile
    container_name: mt5-node
    restart: unless-stopped
    expose:
      - 3000
      - 8900
    environment:
      - CUSTOM_USER=admin
      - PASSWORD=freebuff2026
      - MT5_LOGIN=${MT5_LOGIN:-}
      - MT5_PASSWORD=${MT5_PASSWORD:-}
      - MT5_SERVER=${MT5_SERVER:-}
      - MT5_PATH=${MT5_PATH:-}
      - MT5_PORTABLE=${MT5_PORTABLE:-false}
    volumes:
      - mt5_config:/config
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mvvtu160tgxmnayuys4jaaph"
      - "traefik.http.routers.freebuff-mt5.rule=Host(`mt5.onetapweb.com`)"
      - "traefik.http.routers.freebuff-mt5.entrypoints=http,https"
      - "traefik.http.routers.freebuff-mt5.tls=true"
      - "traefik.http.routers.freebuff-mt5.tls.certresolver=letsencrypt"
      - "traefik.http.routers.freebuff-mt5.service=freebuff-mt5"
      - "traefik.http.services.freebuff-mt5.loadbalancer.server.port=3000"

  mt5ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mt5ai
    # Coolify may attach persistent volumes with restrictive ownership.  Run
    # the app as root so the entrypoint can repair the mount permissions before
    # SQLite and the worker open the shared database.
    user: "0:0"
    restart: unless-stopped
    depends_on:
      - mt5-node
    expose:
      - 8501
    environment:
      - MT5_MODE=bridge
      - BRIDGE_URL=http://mt5-node:8900
      - BRIDGE_TOKEN=${BRIDGE_TOKEN:-}
      - TRADING_MODE=${TRADING_MODE:-PAPER}
      - DATABASE_URL=sqlite+aiosqlite:////app/data/freebuff.db
      - DATABASE_URL_SYNC=sqlite:////app/data/freebuff.db
      - CODEX_AUTH_JSON=${CODEX_AUTH_JSON:-}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-freebuff2026}
      - DASHBOARD_REFRESH_SECONDS=${DASHBOARD_REFRESH_SECONDS:-10}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - AI_CLI_BIN=${AI_CLI_BIN:-agy}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-deepseek/deepseek-chat}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL:-https://trade.onetapweb.com}
      - OPENROUTER_APP_NAME=${OPENROUTER_APP_NAME:-Freebuff Trading}
      - OPENROUTER_MODEL_CONFIG_PATH=${OPENROUTER_MODEL_CONFIG_PATH:-/app/data/openrouter_model.json}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - mt5ai_data:/app/data
      - mt5ai_models:/app/models
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mvvtu160tgxmnayuys4jaaph"
      - "traefik.http.routers.freebuff-bot.rule=Host(`trade.onetapweb.com`)"
      - "traefik.http.routers.freebuff-bot.entrypoints=http,https"
      - "traefik.http.routers.freebuff-bot.tls=true"
      - "traefik.http.routers.freebuff-bot.tls.certresolver=letsencrypt"
      - "traefik.http.routers.freebuff-bot.service=freebuff-bot"
      - "traefik.http.services.freebuff-bot.loadbalancer.server.port=8501"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  mt5ai-trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mt5ai-trainer
    user: "0:0"
    restart: unless-stopped
    depends_on:
      - mt5ai
    command: ["bash", "-c", "mkdir -p /app/data /app/models && chmod 0777 /app/data /app/models 2>/dev/null || true; exec python scripts/retrain_loop.py"]
    environment:
      - TRAINING_DB_PATH=/app/data/freebuff.db
      - TRAINING_MODEL_DIR=/app/models
      - TRAINING_MIN_SAMPLES=${TRAINING_MIN_SAMPLES:-50}
      - TRAINING_INTERVAL_SECONDS=${TRAINING_INTERVAL_SECONDS:-86400}
    volumes:
      - mt5ai_data:/app/data
      - mt5ai_models:/app/models

volumes:
  mt5_config:
  mt5ai_data:
  mt5ai_models:
