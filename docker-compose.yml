services:
  mt5ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mt5ai
    # Coolify may attach persistent volumes with restrictive ownership.  Run
    # the app as root so the entrypoint can repair the mount permissions before
    # SQLite and the worker open the shared database.
    user: "0:0"
    restart: unless-stopped
    expose:
      - 8501
      - 7681
    environment:
      - BINANCE_MODE=${BINANCE_MODE:-paper}
      - BINANCE_BASE_URL=${BINANCE_BASE_URL:-https://testnet.binancefuture.com}
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
      - BINANCE_TIMEOUT=${BINANCE_TIMEOUT:-10}
      - BINANCE_SYMBOL=${BINANCE_SYMBOL:-BTCUSDT}
      - BINANCE_USE_WEBSOCKET=${BINANCE_USE_WEBSOCKET:-false}
      - PAPER_INITIAL_BALANCE=${PAPER_INITIAL_BALANCE:-100000}
      - TRADING_MODE=${TRADING_MODE:-PAPER}
      - DATABASE_URL=sqlite+aiosqlite:////app/data/freebuff.db
      - DATABASE_URL_SYNC=sqlite:////app/data/freebuff.db
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-freebuff2026}
      - DASHBOARD_REFRESH_SECONDS=${DASHBOARD_REFRESH_SECONDS:-10}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - mt5ai_data:/app/data
      - mt5ai_models:/app/models
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mvvtu160tgxmnayuys4jaaph"
      # Web App HTTPS (Port 443)
      - "traefik.http.routers.freebuff-bot-secure.rule=Host(`trade.onetapweb.com`)"
      - "traefik.http.routers.freebuff-bot-secure.entrypoints=https"
      - "traefik.http.routers.freebuff-bot-secure.tls=true"
      - "traefik.http.routers.freebuff-bot-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.freebuff-bot-secure.service=freebuff-bot"
      # Web App HTTP (Port 80) - Direct route to avoid Cloudflare Flexible SSL redirect loop
      - "traefik.http.routers.freebuff-bot-http.rule=Host(`trade.onetapweb.com`)"
      - "traefik.http.routers.freebuff-bot-http.entrypoints=http"
      - "traefik.http.routers.freebuff-bot-http.service=freebuff-bot"
      - "traefik.http.services.freebuff-bot.loadbalancer.server.port=8501"
      # Terminal HTTPS (/terminal)
      - "traefik.http.routers.freebuff-terminal-secure.rule=Host(`trade.onetapweb.com`) && PathPrefix(`/terminal`)"
      - "traefik.http.routers.freebuff-terminal-secure.priority=100"
      - "traefik.http.routers.freebuff-terminal-secure.entrypoints=https"
      - "traefik.http.routers.freebuff-terminal-secure.tls=true"
      - "traefik.http.routers.freebuff-terminal-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.freebuff-terminal-secure.service=freebuff-terminal"
      # Terminal HTTP (/terminal)
      - "traefik.http.routers.freebuff-terminal-http.rule=Host(`trade.onetapweb.com`) && PathPrefix(`/terminal`)"
      - "traefik.http.routers.freebuff-terminal-http.priority=100"
      - "traefik.http.routers.freebuff-terminal-http.entrypoints=http"
      - "traefik.http.routers.freebuff-terminal-http.service=freebuff-terminal"
      - "traefik.http.services.freebuff-terminal.loadbalancer.server.port=7681"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  mt5ai-trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mt5ai-trainer
    user: "0:0"
    restart: unless-stopped
    depends_on:
      - mt5ai
    command: ["bash", "-c", "mkdir -p /app/data /app/models && chmod 0777 /app/data /app/models 2>/dev/null || true; exec python scripts/retrain_loop.py"]
    environment:
      - TRAINING_DB_PATH=/app/data/freebuff.db
      - TRAINING_MODEL_DIR=/app/models
      - TRAINING_MIN_SAMPLES=${TRAINING_MIN_SAMPLES:-50}
      - TRAINING_INTERVAL_SECONDS=${TRAINING_INTERVAL_SECONDS:-86400}
    volumes:
      - mt5ai_data:/app/data
      - mt5ai_models:/app/models

volumes:
  mt5ai_data:
  mt5ai_models:
