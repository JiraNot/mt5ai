version: '3.8'

services:
  mt5-node:
    build:
      context: .
      dockerfile: docker/mt5/Dockerfile
    container_name: mt5-node
    restart: unless-stopped
    expose:
      - 3000
      - 8900
    environment:
      - CUSTOM_USER=admin
      - PASSWORD=freebuff2026
    volumes:
      - mt5_config:/config
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mvvtu160tgxmnayuys4jaaph"
      - "traefik.http.routers.mt5.rule=Host(`mt5.onetapweb.com`)"
      - "traefik.http.routers.mt5.entrypoints=http,https"
      - "traefik.http.routers.mt5.tls=true"
      - "traefik.http.routers.mt5.tls.certresolver=letsencrypt"
      - "traefik.http.services.mt5.loadbalancer.server.port=3000"

  mt5ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mt5ai
    restart: unless-stopped
    depends_on:
      - mt5-node
    expose:
      - 8501
    environment:
      - MT5_MODE=bridge
      - BRIDGE_URL=http://mt5-node:8900
      - TRADING_MODE=${TRADING_MODE:-PAPER}
      - DATABASE_URL=sqlite+aiosqlite:///app/data/freebuff.db
      - DATABASE_URL_SYNC=sqlite:////app/data/freebuff.db
      - CODEX_AUTH_JSON=${CODEX_AUTH_JSON:-}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-freebuff2026}
      - DASHBOARD_REFRESH_SECONDS=${DASHBOARD_REFRESH_SECONDS:-10}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - AI_CLI_BIN=${AI_CLI_BIN:-agy}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - mt5ai_data:/app/data
      - mt5ai_models:/app/models
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mvvtu160tgxmnayuys4jaaph"
      - "traefik.http.routers.bot.rule=Host(`trade.onetapweb.com`)"
      - "traefik.http.routers.bot.entrypoints=http,https"
      - "traefik.http.routers.bot.tls=true"
      - "traefik.http.routers.bot.tls.certresolver=letsencrypt"
      - "traefik.http.services.bot.loadbalancer.server.port=8501"

  mt5ai-trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mt5ai-trainer
    restart: unless-stopped
    depends_on:
      - mt5ai
    command: ["bash", "-c", "mkdir -p /app/data /app/models && exec python scripts/retrain_loop.py"]
    environment:
      - TRAINING_DB_PATH=/app/data/freebuff.db
      - TRAINING_MODEL_DIR=/app/models
      - TRAINING_MIN_SAMPLES=${TRAINING_MIN_SAMPLES:-50}
      - TRAINING_INTERVAL_SECONDS=${TRAINING_INTERVAL_SECONDS:-86400}
    volumes:
      - mt5ai_data:/app/data
      - mt5ai_models:/app/models

volumes:
  mt5_config:
  mt5ai_data:
  mt5ai_models:
