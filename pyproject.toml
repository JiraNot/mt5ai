[tool.poetry]
name = "freebuff"
version = "0.1.0"
description = "AI-powered Trading Decision Platform for MT5"
authors = ["Freebuff Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
metatrader5 = ">=5.0.45"
sqlalchemy = {version = "^2.0", extras = ["asyncio"]}
alembic = "^1.13"
asyncpg = ">=0.29"
pydantic = "^2.5"
pydantic-settings = "^2.1"
pyyaml = ">=6.0"
redis = {version = "^5.0", extras = ["hiredis"]}
numpy = ">=1.26"
pandas = ">=2.1"
structlog = "^24.1"
httpx = ">=0.26"
python-dotenv = ">=1.0"
streamlit = ">=1.30"
plotly = ">=5.18"
aiosqlite = ">=0.19"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.23"
pytest-cov = "^4.1"
ruff = ">=0.1"
mypy = ">=1.8"

[tool.poetry.group.ml.dependencies]
scikit-learn = ">=1.4"
xgboost = ">=2.0"
shap = ">=0.44"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
